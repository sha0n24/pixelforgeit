<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Spreadsheet manager: view, add, edit and delete records.">
  <meta name="theme-color" content="#788F68">
  <title>Sheet Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <section id="auth" class="auth" hidden>
    <div class="card">
      <h1 id="atitle">Sign in</h1>
      <p id="authMsg" role="alert"></p>
      <form id="loginForm" hidden>
        <label for="lu">Username</label><input id="lu" autocomplete="username" required>
        <label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required>
        <button type="submit">Log in</button>
      </form>
      <form id="setupForm" hidden>
        <p class="hint">Creates the spreadsheet, all sheets, and the first Manager account.</p>
        <label for="sk">Setup key</label><input id="sk" type="password" autocomplete="off" required>
        <label for="sn">Full name</label><input id="sn" autocomplete="name" required>
        <label for="su">Username</label><input id="su" autocomplete="username" required>
        <label for="sp">Password (min 8 characters)</label><input id="sp" type="password" minlength="8" autocomplete="new-password" required>
        <button type="submit">Create system</button>
      </form>
    </div>
  </section>

  <div id="app" hidden>
  <div class="shell">
    <header class="top">
      <div>
        <h1 id="title">Sheet Manager</h1>
        <div id="who" class="who"></div>
      </div>
      <div class="actions" role="toolbar" aria-label="Page actions">
        <button id="refresh" type="button" class="ghost">Refresh</button>
        <button id="repair" type="button" class="ghost" hidden>Repair Sheets</button>
        <button id="theme" type="button" class="ghost" aria-label="Toggle dark or light mode">Dark/Light</button>
        <button id="logout" type="button" class="ghost">Logout</button>
      </div>
    </header>

    <main id="main" class="hero">
      <div class="clock" role="timer" aria-label="Current date and time">
        <span id="clkD" class="cd"></span>
        <span id="clkT" class="ct"></span>
      </div>
      <nav id="tabs" class="tabs" aria-label="Sections"><button data-tab="dashboard" class="on">Dashboard</button><button data-tab="clients">Clients</button><button data-tab="sales">Sales</button><button data-tab="users" hidden>Users</button></nav>
      <div id="tools" class="tools" role="toolbar" aria-label="Table tools" hidden>
        <select id="roleFilter" aria-label="Filter by role" hidden><option value="">All roles</option><option>Manager</option><option>Sales Executive</option></select>
        <input id="search" type="search" placeholder="Search..." aria-label="Search records">
        <button id="add" type="button">+ Add New</button>
        <button id="csv" type="button" class="ghost">Export CSV</button>
      </div>
      <div id="stats" class="stats" hidden></div>
      <section id="dash" hidden aria-label="Sales dashboard"></section>
      <p id="status" role="status" aria-live="polite"></p>
      <noscript>Please enable JavaScript to use this page.</noscript>
      <div class="wrap" id="wrap"><table id="tbl"></table></div>
      <nav class="pager" id="pager" aria-label="Pagination">
        <button id="prev" type="button" class="ghost">Prev</button>
        <span id="pinfo" aria-live="polite"></span>
        <button id="next" type="button" class="ghost">Next</button>
      </nav>
    </main>
  </div>
  </div>

  <footer class="foot">
    <div class="foot-in">
      <div class="foot-about">
        <p class="foot-name">Shaon Istiak</p>
        <p class="foot-desc">Designed and Developed by Shaon Istiak.</p>
      </div>
      <ul class="social" aria-label="Social media links">
        <li><a href="https://www.facebook.com/YOUR_PROFILE" target="_blank" rel="noopener noreferrer" aria-label="Facebook (opens in a new tab)"><svg aria-hidden="true"><use href="#i-fb"/></svg><span>Facebook</span></a></li>
        <li><a href="https://www.linkedin.com/in/YOUR_PROFILE" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn (opens in a new tab)"><svg aria-hidden="true"><use href="#i-in"/></svg><span>LinkedIn</span></a></li>
        <li><a href="https://github.com/YOUR_USERNAME" target="_blank" rel="noopener noreferrer" aria-label="GitHub (opens in a new tab)"><svg aria-hidden="true"><use href="#i-gh"/></svg><span>GitHub</span></a></li>
        <li><a href="https://www.youtube.com/@YOUR_CHANNEL" target="_blank" rel="noopener noreferrer" aria-label="YouTube (opens in a new tab)"><svg aria-hidden="true"><use href="#i-yt"/></svg><span>YouTube</span></a></li>
      </ul>
    </div>
    <p class="copy">&copy; <span id="year"></span> Shaon Istiak. All rights reserved.</p>
  </footer>

  <dialog id="dlg" aria-labelledby="dtitle">
    <form id="form">
      <h2 id="dtitle"></h2>
      <div id="fields"></div>
      <div class="pager">
        <button type="button" id="cancel" class="ghost">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </dialog>
  <dialog id="info" aria-label="Customer details">
    <div id="icontent"></div>
    <div class="pager"><button type="button" id="iclose" class="ghost">Close</button></div>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
